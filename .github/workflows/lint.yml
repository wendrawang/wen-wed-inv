name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      # --strict menaikkan warning menjadi error. Ini yang membuat aturan
      # di .swiftlint.yml benar-benar menahan PR, bukan sekadar memberi tanda.
      # Turunkan flag ini kalau backlog warning dari kode lama masih banyak,
      # lalu naikkan lagi setelah bersih.
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
